# Vor der Zertifikatsausstellung als /etc/nginx/conf.d/beispielbusiness.conf installieren.
# Diese Datei beansprucht nur die beiden Namen dieser Website auf Port 80.
server {
    listen 80;
    server_name beispielbusiness.de www.beispielbusiness.de;
    access_log off;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:18180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
