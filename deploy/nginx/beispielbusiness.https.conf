# Nach der Zertifikatsausstellung als /etc/nginx/conf.d/beispielbusiness.conf installieren.
# Zertifikat muss beide Namen enthalten. Port 18180 muss zum Compose-HTTP_PORT passen.
server {
    listen 80;
    server_name beispielbusiness.de www.beispielbusiness.de;
    access_log off;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://beispielbusiness.de$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.beispielbusiness.de;
    access_log off;
    error_log /dev/null crit;

    ssl_certificate /etc/letsencrypt/live/beispielbusiness.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beispielbusiness.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Let's-Encrypt-Zertifikate enthalten keine OCSP-Responder-URL mehr.
    ssl_stapling off;

    return 301 https://beispielbusiness.de$request_uri;
}

server {
    listen 443 ssl;
    server_name beispielbusiness.de;
    access_log off;
    error_log /dev/null crit;

    ssl_certificate /etc/letsencrypt/live/beispielbusiness.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beispielbusiness.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_stapling off;

    location / {
        proxy_pass http://127.0.0.1:18180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
