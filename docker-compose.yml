services:
  web:
    build: .
    image: beispielbusiness-web:latest
    container_name: beispielbusiness-web
    restart: unless-stopped
    ports:
      # Nur für den lokalen Reverse Proxy erreichbar; bei Bedarf HTTP_PORT anpassen.
      - "127.0.0.1:${HTTP_PORT:-18180}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  counter:
    build: ./counter
    image: beispielbusiness-counter:latest
    container_name: beispielbusiness-counter
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - pageviews:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pageviews:
