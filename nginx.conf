# nginx-Konfiguration für beispielbusiness.de
# Statische Auslieferung; TLS wird von einem vorgeschalteten Reverse Proxy übernommen.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;
    charset_types text/css text/plain text/xml application/xml application/javascript application/json image/svg+xml;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Zugriffsprotokoll mit gekürzter IP-Adresse und ohne Query-String
    map $remote_addr $remote_addr_anon {
        ~(?P<ip>\d+\.\d+\.\d+)\.\d+    $ip.0;
        ~(?P<ip>[^:]+:[^:]+:[^:]+):    $ip::;
        default                        0.0.0.0;
    }
    map $request_uri $request_path {
        ~^(?P<path>[^?]*)              $path;
    }
    log_format anonymized '$remote_addr_anon - [$time_local] "$request_method $request_path $server_protocol" '
                          '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log anonymized;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/javascript
        application/json
        application/ld+json
        image/svg+xml
        image/x-icon;

    # Cache-Header je Inhaltstyp (CSS/JS werden über ?v= versioniert)
    map $sent_http_content_type $cache_control {
        default                       "public, max-age=3600";
        ~*^text/html                  "no-cache";
        ~*^text/css                   "public, max-age=2592000";
        ~*javascript                  "public, max-age=2592000";
        ~*^font/                      "public, max-age=31536000, immutable";
        ~*^image/                     "public, max-age=2592000";
        ~*^(text|application)/xml     "public, max-age=86400";
        ~*^text/plain                 "public, max-age=86400";
    }

    # www -> ohne www
    server {
        listen 80;
        server_name www.beispielbusiness.de;
        return 301 https://beispielbusiness.de$request_uri;
    }

    server {
        listen 80 default_server;
        server_name beispielbusiness.de;

        root /usr/share/nginx/html;
        index index.html;

        # Weiterleitungen relativ ausgeben (korrekt hinter einem TLS-Proxy)
        absolute_redirect off;

        # Header gelten für alle Antworten dieses Servers.
        # Hinweis: add_header in einem location-Block würde diese Header dort ersetzen.
        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Sandbox: nicht in Suchmaschinen-Indizes aufnehmen (Crawling für Tests bleibt erlaubt)
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        # HSTS erst aktivieren, wenn die Domain dauerhaft per HTTPS ausgeliefert wird:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        error_page 404 /404.html;
        error_page 403 =404 /404.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /404.html {
            internal;
        }

        # Kein eigener Produktindex: direkt zum Kernprodukt
        location = /produkte/ {
            return 301 /produkte/beispielclamp-200/;
        }

        location = /produkte {
            return 301 /produkte/beispielclamp-200/;
        }

        # Kontaktformular ohne JavaScript: Daten werden nicht verarbeitet, zurück zum Formular
        location = /kontakt/ {
            if ($request_method = POST) {
                return 303 /kontakt/#anfrage;
            }
            try_files $uri $uri/ =404;
        }

        location = /robots.txt {
            log_not_found off;
        }

        location = /favicon.ico {
            log_not_found off;
        }

        # Healthcheck für Docker
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Versteckte Dateien nicht ausliefern
        location ~ /\.(?!well-known/) {
            return 404;
        }
    }
}
